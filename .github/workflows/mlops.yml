name: MLOps CI/CD Pipeline - GitHub Container Registry & Inference Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Model Validation & API Integration Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify or Train Pipeline Artifacts
        run: |
          python -c "from app.pipeline import FraudEnginePipeline; FraudEnginePipeline()" || (echo "Re-training pipeline artifacts for CI environment..." && python train_and_export.py)

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --verbose

  build-and-push-ghcr:
    name: Build & Push Docker Image to GitHub Container Registry (GHCR)
    needs: test-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vishnuganugula/high-frequency-transaction-risk-engine
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=commit-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
